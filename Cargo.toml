[workspace]
members = [
    ".",
    "crates/bbwick_engine",
    "crates/canonical_ohlc_arrow",
    "crates/canonical_ohlc_resync",
]
exclude = ["vendor/rs-clob-client-v2"]
resolver = "2"

[patch."https://github.com/Polymarket/rs-clob-client-v2.git"]
polymarket_client_sdk_v2 = { path = "vendor/rs-clob-client-v2" }

[package]
name = "polymarket-hft"
version = "0.2.0"
edition = "2021"
description = "Low-latency trading project scaffold for Polymarket-style markets"
license = "Apache-2.0"
publish = false
rust-version = "1.88.0"

[lib]
name = "polymarket_hft"
path = "src/lib.rs"

[[bin]]
name = "trader"
path = "src/bin/trader.rs"

[dependencies]
anyhow = "1.0"
arrow-array = "57.1.0"
arrow-buffer = "57.1.0"
arrow-ipc = { version = "57.1.0", features = ["zstd"] }
arrow-schema = "57.1.0"
axum = { version = "0.8", features = ["ws"] }
bitflags = "2.10"
bytes = "1"
memmap2 = "0.9"
alloy = { version = "1.5", default-features = false, features = ["contract", "providers", "reqwest", "reqwest-rustls-tls", "rpc-types", "signer-local", "signers", "sol-types"] }
alloy-signer-local = "1.6"
bbwick-engine = { path = "crates/bbwick_engine" }
canonical_ohlc_arrow = { path = "crates/canonical_ohlc_arrow" }
canonical_ohlc_resync = { path = "crates/canonical_ohlc_resync" }
cmaes = { path = "crates/cmaes_batch", default-features = false }
config = { version = "0.15", default-features = false, features = ["toml"] }
directories = "6.0"
futures-util = "0.3"
notify = "6.1"
nalgebra = "0.33.2"
polymarket-client-sdk = { package = "polymarket_client_sdk_v2", git = "https://github.com/Polymarket/rs-clob-client-v2.git", rev = "3ae1aae5e9ded38f984464c9fc0f307f8a9f41fb", features = ["clob", "ws", "gamma", "data", "heartbeats", "tracing"] }
chrono = "0.4"
rand = "=0.8.5"
rayon = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks"] }
rmp-serde = "1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "0.8"
yaml-rust2 = "0.10"
base64 = "0.22"
hmac = "0.12"
libc = "0.2"
sha2 = "0.10"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
ta = "0.5"
fin-primitives = { version = "4.0.1", default-features = false, features = ["indicators"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
dotenvy = "0.15.7"
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"
strip = "symbols"

[profile.dev]
debug = 1
incremental = false

[profile.dev-live]
inherits = "release"
codegen-units = 16
debug = 0
# ThinLTO plus incremental caching has repeatedly produced corrupted dev-live
# artifacts and linker-only failures during `make dev`.
incremental = false
lto = "thin"
strip = "symbols"

[profile.release-hft]
inherits = "release"
codegen-units = 1
incremental = false
lto = "thin"
panic = "unwind"

[profile.release-hft-prof]
inherits = "release-hft"
debug = "limited"
strip = "none"
