[package]
name = "canonical_ohlc_resync"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
canonical_ohlc_arrow = { path = "../canonical_ohlc_arrow" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2"] }
reqwest-middleware = { version = "0.5.0", features = ["query"] }
reqwest-retry = "0.9.0"
retry-policies = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
